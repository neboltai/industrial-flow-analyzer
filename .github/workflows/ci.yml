name: Community Edition CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev,mcp]'
      - run: python scripts/check_release.py
      - name: Reproducible build and clean archive install
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_release.py --output-dir build/first
          python scripts/build_release.py --output-dir build/second
          cmp build/first/*.zip build/second/*.zip
          python -m zipfile -e build/first/intralogistics-flow-analyzer-0.1.2.zip build/extracted
          python -m venv build/archive-env
          build/archive-env/bin/python -m pip install './build/extracted/intralogistics-flow-analyzer[dev,mcp]'
          cd build/extracted/intralogistics-flow-analyzer
          ../../archive-env/bin/python scripts/check_release.py
